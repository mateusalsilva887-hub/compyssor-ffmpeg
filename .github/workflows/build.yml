name: Build FFmpeg

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag do release (ex.: ffmpeg-8.1.3-1)"
        required: true
        default: "ffmpeg-8.1.3-1"

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas de build
        run: brew install nasm autoconf automake libtool pkgconf

      - name: Compilar
        run: bash scripts/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  mirror:
    name: Windows e Linux (BtbN)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copiar builds da BtbN
        run: bash scripts/mirror-btbn.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mirror
          path: dist/*
          retention-days: 7

  release:
    name: Publicar release
    needs: [macos, mirror]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "FFmpeg 8.1.3 LGPL usado pelo Compyssor. macOS compilado neste repositório; Windows e Linux copiados da BtbN (autobuild-2026-09-30-13-08). Hashes em SHA256SUMS."
