name: Build FFmpeg

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag do release (ex.: ffmpeg-8.1.3-2). Vazio = só gerar os arquivos."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas de build
        run: brew install nasm autoconf automake libtool pkgconf

      - name: Compilar e testar
        run: bash scripts/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  windows-build:
    name: Windows x86_64 (compilar)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas de build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 nasm cmake autoconf automake libtool pkg-config zip

      - name: Compilar
        run: bash scripts/build-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*
          retention-days: 7

  windows-test:
    name: Windows x86_64 (testar)
    needs: windows-build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist

      - name: Testar
        shell: bash
        run: |
          unzip -q dist/*.zip -d build
          bash scripts/test-ffmpeg.sh build/ffmpeg-*-windows-x86_64 h264_mf h264_nvenc h264_amf h264_qsv

  mirror:
    name: Linux (BtbN)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copiar builds da BtbN
        run: bash scripts/mirror-btbn.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mirror
          path: dist/*
          retention-days: 7

  release:
    name: Publicar release
    if: inputs.release_tag != ''
    needs: [macos, windows-test, mirror]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "FFmpeg 8.1.3 LGPL usado pelo Compyssor. macOS e Windows compilados neste repositório, só com os componentes que o Compyssor usa e sem protocolos de rede; Linux copiado da BtbN (autobuild-2026-09-30-13-08). Hashes em SHA256SUMS."
